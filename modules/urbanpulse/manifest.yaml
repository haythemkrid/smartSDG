id: urbanpulse
version: 0.1.0
title: UrbanPulse
sdg: [11]
sensors: [sentinel-2-l2a]
indices: [ndbi]
aoi_id: grand_tunis
temporal_resolution: quarterly
spatial_resolution_m: 10
params:
  ndbi:
    builtup_threshold: 0.0
    train_sample_pixels: 10000
    pixel_classifier: {n_estimators: 50, max_depth: 8}
outputs:
  - {name: ndbi_layer, type: cog}
  - {name: builtup_timeseries, type: geoparquet}